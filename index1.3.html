<!doctype html><html><head><link rel="apple-touch-icon" href="icon.jpg">
<link rel="icon" href="icon.jpg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gameplay Controller</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:white;font:16px Arial}#tools{padding:12px;display:flex;flex-wrap:wrap;gap:8px}input,button{font:inherit}#stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}#stage:fullscreen{width:100%;height:100%;aspect-ratio:auto}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:0;pointer-events:none}#transparentPad{position:absolute;inset:0;z-index:2;background:transparent;user-select:none;touch-action:none;pointer-events:none}#transparentPad .shell{position:absolute;inset:0;background:transparent}#transparentPad button{pointer-events:auto;position:absolute;transform:translate(-50%,-50%);width:7.5%;aspect-ratio:1;border-radius:50%;border:1px solid #777;background:linear-gradient(145deg,#55565a,#202124 45%,#080808);box-shadow:0 3px 4px #0008,inset 0 1px 2px #aaa;color:#eee;font-size:clamp(17px,4vw,32px);display:grid;place-items:center;padding:0;touch-action:none;cursor:pointer;transition:transform .08s,box-shadow .08s}#transparentPad button.down{transform:translate(-50%,-50%) scale(.89);box-shadow:inset 0 4px 7px #000;background:linear-gradient(#111,#444)}#transparentPad .d{border-radius:28%;width:7%;font-size:clamp(10px,2vw,18px);color:#999}#transparentPad .small{width:3.5%;border-radius:40%;aspect-ratio:.6;background:linear-gradient(90deg,#333,#aaa,#555)}#transparentPad .stick{pointer-events:auto;position:absolute;width:13%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#111 49%,#555 57%,#222 70%);box-shadow:0 3px 5px #0007;touch-action:none}#transparentPad .knob{position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle at 40% 30%,#555,#242424 65%,#111);border:3px solid #555;box-shadow:0 3px 5px #000,inset 0 0 5px #000;pointer-events:none}#msg{padding:8px}#exit{position:absolute;right:8px;top:8px;z-index:3;display:none}#stage:fullscreen #exit,#stage.expanded #exit{display:block}#stage.expanded{position:fixed;inset:0;width:100%;height:100%;z-index:9;aspect-ratio:auto}
#screen{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;background:#000}#stage video{width:1px;height:1px;opacity:.01;left:0;top:0} #transparentPad button,#transparentPad .stick{opacity:0.90}

/* Keep the controller on a proportional 16:9 surface in every mode. */
#transparentPad{inset:auto;left:50%;top:50%;width:100%;height:auto;aspect-ratio:16/9;transform:translate(-50%,-50%);container-type:inline-size}
#stage.expanded #transparentPad,#stage:fullscreen #transparentPad{width:min(100vw,177.7778vh);width:min(100vw,177.7778dvh)}
#transparentPad button{font-size:clamp(10px,4cqw,32px)}
#transparentPad .d{font-size:clamp(10px,2cqw,18px)}
</style></head><body><div id="tools"><input id="url" type="url" placeholder="Direct MP4 video link"><button id="load">Load link</button><input id="file" type="file" accept="video/*"><button id="play">Play / Pause</button><button id="full">Full screen</button><button id="sound">Sound on / off</button></div><div id="stage"><video id="video" playsinline webkit-playsinline muted autoplay loop preload="auto" disablepictureinpicture disableremoteplayback></video><canvas id="screen"></canvas><div id="transparentPad"><div class="shell">
<button class="d" style="left:18%;top:26%;" data-key="UP" aria-label="UP">▲</button>
<button class="d" style="left:10.5%;top:42%;" data-key="LEFT" aria-label="LEFT">◀</button>
<button class="d" style="left:25.5%;top:42%;" data-key="RIGHT" aria-label="RIGHT">▶</button>
<button class="d" style="left:18%;top:58%;" data-key="DOWN" aria-label="DOWN">▼</button>
<button class="" style="left:82%;top:23%;color:#66e5d9;" data-key="TRIANGLE" aria-label="TRIANGLE">△</button>
<button class="" style="left:73%;top:42%;color:#e8a5db;" data-key="SQUARE" aria-label="SQUARE">□</button>
<button class="" style="left:91%;top:42%;color:#ff777e;" data-key="CIRCLE" aria-label="CIRCLE">○</button>
<button class="" style="left:82%;top:61%;color:#9acaff;" data-key="CROSS" aria-label="CROSS">×</button>
<button class="small" style="left:31%;top:14%;" data-key="SHARE" aria-label="SHARE"></button>
<button class="small" style="left:69%;top:14%;" data-key="OPTIONS" aria-label="OPTIONS"></button>
<button class="" style="left:50%;top:85%;width:5.5%;font-size:12px;" data-key="PS" aria-label="PS">PS</button>
<div class="stick" style="left:33%;top:79%" data-stick="left"><div class="knob"></div></div><div class="stick" style="left:67%;top:79%" data-stick="right"><div class="knob"></div></div></div></div><button id="exit">Exit</button></div><div id="msg">Select a video or paste a direct video link.</div><script>
// Optional: paste a direct video URL here, or use the on-screen controls.
const VIDEO_URL = "";
const root=document.getElementById('transparentPad'),video=document.getElementById('video'),stage=document.getElementById('stage'),msg=document.getElementById('msg');let objectURL;
const emit=(type,detail)=>root.dispatchEvent(new CustomEvent(type,{detail,bubbles:true}));
root.querySelectorAll('button').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('down');emit('gamebutton',{button:b.dataset.key,pressed:true});};const release=()=>{if(!b.classList.contains('down'))return;b.classList.remove('down');emit('gamebutton',{button:b.dataset.key,pressed:false});};b.onpointerup=release;b.onpointercancel=release;b.onlostpointercapture=release;});
root.querySelectorAll('.stick').forEach(s=>{let pid=null;const knob=s.firstElementChild;function move(e){const r=s.getBoundingClientRect(),max=r.width*.28;let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const d=Math.hypot(x,y);if(d>max){x*=max/d;y*=max/d;}knob.style.transform=`translate(${x}px,${y}px)`;emit('gameaxis',{stick:s.dataset.stick,x:x/max,y:-y/max});}s.onpointerdown=e=>{if(pid!==null)return;pid=e.pointerId;s.setPointerCapture(pid);move(e);};s.onpointermove=e=>{if(e.pointerId===pid)move(e);};const reset=e=>{if(e.pointerId!==pid)return;pid=null;knob.style.transform='translate(0,0)';emit('gameaxis',{stick:s.dataset.stick,x:0,y:0});};s.onpointerup=reset;s.onpointercancel=reset;s.onlostpointercapture=reset;});
const canvas=document.getElementById('screen'),ctx=canvas.getContext('2d');
function draw(){const w=stage.clientWidth,h=stage.clientHeight,d=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);}if(video.readyState>=2&&video.videoWidth){const scale=Math.min(canvas.width/video.videoWidth,canvas.height/video.videoHeight),vw=video.videoWidth*scale,vh=video.videoHeight*scale;ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);try{ctx.drawImage(video,(canvas.width-vw)/2,(canvas.height-vh)/2,vw,vh);}catch(e){}}requestAnimationFrame(draw);}requestAnimationFrame(draw);
video.addEventListener('webkitbeginfullscreen',()=>{try{video.webkitExitFullscreen();}catch(e){}msg.textContent='This app forces native video playback. Try a browser or a preview supporting inline video.';});
video.controls=false;video.playsInline=true;video.setAttribute("playsinline","");video.setAttribute("webkit-playsinline","");video.muted=true;function play(){video.play().catch(()=>msg.textContent='Tap Play to start the video.');}function load(src){video.src=src;msg.textContent='Gameplay simulation — controls do not change the recording.';play();}document.getElementById('load').onclick=()=>{const u=document.getElementById('url').value.trim();if(u)load(u);};document.getElementById('file').onchange=e=>{if(!e.target.files[0])return;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(e.target.files[0]);load(objectURL);};document.getElementById('play').onclick=()=>video.paused?play():video.pause();document.getElementById('sound').onclick=()=>{video.muted=!video.muted;};video.onerror=()=>msg.textContent='Video could not load. Try a local MP4 or a direct video URL.';document.getElementById('full').onclick=()=>{stage.classList.add('expanded');play();};document.getElementById('exit').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();stage.classList.remove('expanded');};if(VIDEO_URL){load(VIDEO_URL);}
</script></body></html>
